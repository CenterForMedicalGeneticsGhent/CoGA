name: CI

# Run the same gates that were previously only run by hand. Mark "backend" and
# "frontend" as required status checks in branch protection so they must pass
# before a PR can merge.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Run tests
        # The suite is self-contained (Postgres/ClickHouse access is mocked), so
        # no service containers are required. Honours pytest.ini testpaths
        # (tests + backend/tests).
        run: python -m pytest -q

  frontend:
    name: frontend (tsc + eslint + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run tsc
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
