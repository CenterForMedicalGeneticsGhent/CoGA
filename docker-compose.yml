services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    restart: always
    # ClickHouse needs time to finish flushing/merging on SIGTERM. Docker's
    # default 10s grace can SIGKILL it mid-flush, truncating parts into
    # broken-on-start corruption on the next boot (the 2026-06-11 volume event).
    stop_grace_period: 5m
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --host 127.0.0.1 --port 9000 --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1'",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"

  backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    healthcheck:
      # Liveness via stdlib (no curl in the image): non-200 / unreachable -> unhealthy.
      test:
        - CMD-SHELL
        - >-
          python -c "import sys,urllib.request;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      # Startup runs schema init + seeds (+ optional reference bootstrap); give it
      # room before failures count against the container.
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_GITHUB_REPOSITORY_URL: ${VITE_GITHUB_REPOSITORY_URL:-}
        VITE_GITHUB_RELEASES_URL: ${VITE_GITHUB_RELEASES_URL:-}
        VITE_GITHUB_ISSUES_URL: ${VITE_GITHUB_ISSUES_URL:-}
    env_file:
      - .env
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        # Don't serve the UI until the backend is healthy, so users never hit the
        # "Unable to reach API" state from a still-starting or crash-looping backend.
        condition: service_healthy

volumes:
  postgres_data:
  clickhouse_data:
